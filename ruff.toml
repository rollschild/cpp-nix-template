# Ruff, the Python linter and formatter. `nix fmt` and `nix flake check` use it
# for all *.py files. Editors with `ruff server` also read this file.
target-version = "py314"

[lint]
# The defaults (pyflakes and core pycodestyle), and also bugbear, isort,
# pyupgrade and the Ruff rules.
extend-select = ["B", "I", "UP", "RUF"]
