name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Builds the package, runs the tests, and verifies formatting.
      - run: nix flake check -L
