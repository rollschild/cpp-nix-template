name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Package builds and tests (GCC, Clang), clang-tidy, format and lint.
      - run: nix flake check -L
      # The daily workflow (dev shell and presets): a Debug build with
      # AddressSanitizer and UBSan, and warnings as errors.
      - run: nix develop --command cmake --workflow --preset asan
