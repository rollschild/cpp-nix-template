# Each month, Dependabot opens pull requests that update the flake inputs
# (flake.lock) and the GitHub Actions of CI. CI builds and tests each update.
version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    groups:
      flake-inputs:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
